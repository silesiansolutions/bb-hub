name: bb-hub

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ghcr.io/silesiansolutions/bb-hub-api:local
    restart: unless-stopped
    environment:
      PORT: 3001
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/bb}
      REDIS_URL: redis://redis:6379
      ORIGIN_SECRET: ${ORIGIN_SECRET:-}
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-false}
      BUFFER_DIR: /var/lib/bb/buffer
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      BB_DATA_REPO: ${BB_DATA_REPO:-}
      BB_DATA_DIR: /var/lib/bb/bb-data
      BB_DATA_SSH_KEY: ${BB_DATA_SSH_KEY:-}
      BB_DATA_GIT_NAME: ${BB_DATA_GIT_NAME:-rylkobot}
      BB_DATA_GIT_EMAIL: ${BB_DATA_GIT_EMAIL:-204860200+rylkobot@users.noreply.github.com}
    volumes:
      - collector:/var/lib/bb
    ports:
      - 127.0.0.1:3001:3001
    mem_limit: 256m
    memswap_limit: 256m
    stop_grace_period: 60s
    depends_on:
      - redis

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    mem_limit: 64m
    memswap_limit: 64m

  mongo:
    image: mongo:8.0.34
    profiles: ["local-db"]
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - 127.0.0.1:27017:27017
    volumes:
      - mongo:/data/db

volumes:
  collector:
  mongo:
