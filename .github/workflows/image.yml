name: image

on:
  push:
    branches: [master]
    paths:
      - apps/api/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/silesiansolutions/bb-hub-api:sha-${{ github.sha }}
            ghcr.io/silesiansolutions/bb-hub-api:latest
          labels: org.opencontainers.image.source=https://github.com/silesiansolutions/bb-hub
