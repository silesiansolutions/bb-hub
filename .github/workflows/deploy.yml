name: deploy

on:
  pull_request:
    paths:
      - deploy/**
      - apps/edge/**
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      mode:
        description: check runs a dry run, apply changes the server and the Worker
        type: choice
        options: [check, apply]
        default: check
      api_tag:
        description: API image tag on GHCR, sha-<commit> of master
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'check' }}
  API_TAG: ${{ inputs.api_tag || 'latest' }}

jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Secrets present
        id: ready
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: echo "ready=${DEPLOY_HOST:+yes}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7.1.0
        if: steps.ready.outputs.ready == 'yes'
        with:
          python-version: "3.12"
      - name: Ansible
        if: steps.ready.outputs.ready == 'yes'
        run: |
          pip install ansible-core==2.21.5
          ansible-galaxy collection install community.docker:5.4.0
      - name: SSH access
        if: steps.ready.outputs.ready == 'yes'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
      - name: Playbook (${{ env.MODE }})
        if: steps.ready.outputs.ready == 'yes'
        working-directory: deploy/ansible
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          API_PORT: ${{ secrets.API_PORT }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BB_DATA_DEPLOY_KEY: ${{ secrets.BB_DATA_DEPLOY_KEY }}
        run: |
          flags=()
          [ "$MODE" = apply ] || flags=(--check --diff)
          ansible-playbook site.yml -i "${DEPLOY_HOST}," -u root -e "ansible_port=${DEPLOY_PORT}" \
            --private-key ~/.ssh/deploy "${flags[@]}"
      - name: Skipped
        if: steps.ready.outputs.ready != 'yes'
        run: echo "Deployment secrets are not set yet; see docs/deployment.md."

  web:
    needs: api
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @bb-hub/web --filter @bb-hub/edge
      - run: pnpm --filter @bb-hub/web build
      - name: Worker (${{ env.MODE }})
        working-directory: apps/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORIGIN_URL: ${{ secrets.ORIGIN_URL }}
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
        run: |
          if [ "$MODE" != apply ]; then
            pnpm exec wrangler deploy --dry-run --outdir dist
            exit 0
          fi
          umask 077
          jq -n '{ORIGIN_URL: env.ORIGIN_URL, ORIGIN_SECRET: env.ORIGIN_SECRET}' > "$RUNNER_TEMP/worker-secrets.json"
          pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"
          rm -f "$RUNNER_TEMP/worker-secrets.json"

  verify:
    needs: web
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
    runs-on: ubuntu-24.04
    steps:
      - name: Site and API answer through Cloudflare
        run: |
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null -w 'site %{http_code}\n' https://bb.silesiansolutions.com/
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors https://bb.silesiansolutions.com/api/health | jq '{status, mongo: .info.mongo.status, redis: .info.redis.status, collector: .info.collector.sources}'
          curl -fsS https://bb.silesiansolutions.com/api/parkings | jq 'length'
