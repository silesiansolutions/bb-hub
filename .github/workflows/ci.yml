name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:8.0.34
        ports: ["27017:27017"]
      redis:
        image: redis:8.10.2-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: bb-data read key present
        id: validator
        env:
          BB_DATA_READ_KEY: ${{ secrets.BB_DATA_READ_KEY }}
        run: |
          if [ -n "$BB_DATA_READ_KEY" ]; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::BB_DATA_READ_KEY is not set, the bb-data layout validator test is skipped"
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.validator.outputs.available == 'yes'
        with:
          repository: silesiansolutions/bb-data
          ssh-key: ${{ secrets.BB_DATA_READ_KEY }}
          path: bb-data
          sparse-checkout: scripts
          persist-credentials: false
      - run: pnpm test
        env:
          BB_DATA_VALIDATOR: ${{ steps.validator.outputs.available == 'yes' && format('{0}/bb-data/scripts/validate-layout.mjs', github.workspace) || '' }}
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/bb_e2e
          REDIS_URL: redis://127.0.0.1:6379

  api-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: bb-hub-api:ci

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:export
      - run: pnpm typecheck
      - run: test -f out/index.html && test -f out/parking.html && test -f out/air-sensor.html

  edge:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/edge
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ansible-core==2.21.5 && ansible-galaxy collection install community.docker:5.4.0
      - run: ansible-playbook deploy/ansible/site.yml --syntax-check -i localhost,
      - run: touch deploy/api.env deploy/bb-data-key && API_TAG=ci API_PORT=3001 docker compose -f deploy/compose.yaml config --quiet

